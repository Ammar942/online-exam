<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <!-- <link rel="stylesheet" href="online-exam.css" /> -->
    <link rel="stylesheet" href="../../dist/styles.css" />
    <!-- <link rel="stylesheet" href="../online-exam.css" /> -->
    <!-- <link rel="stylesheet" href="fail.css" /> -->
    <title>fail</title>
  </head>
  <body>
    <!-- fail Page -->
    <section class="flex justify-center items-center h-[100vh] bg-beige">
      <div
        class="p-4 overflow-hidden h-[80%] w-[90%] rounded-3xl flex flex-col justify-center items-center gap-3 shadow-2xl capitalize text-primary shadow-primary bg-gradient-to-r from-accent via-secondary to-accent"
      >
        <h1 class="text-white text-center font-bold text-4xl">Result</h1>
        <div class="card-container">
          <div class="img-container">
            <img src="../../images/fail.svg" class="pt-5" alt="fail exam" />
          </div>
          <div class="text-container text-center text-primary txt">
            <p class="">Yalhwy , Your grade is <span class="grade"></span></p>
            <p class="capitalize">
              Sorry <span class="user-name"></span>,You failed in this quiz
            </p>
          </div>
        </div>
        <button
          class="btn relative overflow-hidden bg-blue-600 text-beige bg-primary px-4 py-2 font-medium rounded-lg group"
        >
          <span
            class="absolute inset-60 bg-white opacity-0 transition-opacity duration-500 group-hover:opacity-75"
          ></span>
          <span
            class="absolute inset-0 bg-gradient-to-r opacity-45 from-transparent via-white to-transparent transform translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500 ease-in-out"
          ></span>
          <span class="relative z-10 capitalize">Re-Exam</span>
        </button>
      </div>
    </section>
    <script type="module" src="../logic/main.js"></script>
    <script type="module" src="../logic/fail.js"></script>
  </body>
</html>
