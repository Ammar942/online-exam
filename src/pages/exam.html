<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../dist/styles.css" />
    <link rel="stylesheet" href="../styles/exam.css" />
    <link rel="stylesheet" href="../deadline loading/deadline-loading.css" />
  </head>
  <body>
    <section class="login flex justify-center items-center h-[100vh] bg-beige">
      <div
        class="relative px-10 overflow-hidden h-[80%] w-[90%] rounded-3xl flex flex-col justify-center items-center gap-3 shadow-2xl capitalize text-primary shadow-accent bg-gradient-to-r from-accent via-secondary to-accent"
      >
        <div
          class="hidden z-20 overlay-time absolute h-full w-full bg-text bg-opacity-50 grid flex justify-center items-center"
        >
          <div class="p-10 bg-background rounded-3xl flex flex-col">
            <p class="text-center">your time is almost up</p>

            <p>don't forget to submit your answers</p>
            <br />
            <button
              class="ok relative overflow-hidden text-beige bg-primary px-4 py-2 font-medium rounded-lg group"
            >
              <span
                class="absolute inset-60 bg-white opacity-0 transition-opacity duration-500 group-hover:opacity-75"
              ></span>
              <span
                class="absolute inset-0 bg-gradient-to-r opacity-45 from-transparent via-white to-transparent transform translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500 ease-in-out"
              ></span>
              <span class="relative z-10 capitalize">Ok</span>
            </button>
          </div>
        </div>
        <div class="timer-container relative px-10 flex justify-between w-full">
          <div class="timer"></div>
        </div>
        <div
          id="ques-marked"
          class="w-full md:pt-5 pt-0 flex flex-col md:flex-row justify-between gap-5"
        >
          <div
            id="Q"
            class="p-2 md:w-[80%] w-full flex flex-col justify-start self-start rounded-lg"
          >
            <div class="flex">
              <p class="questionTitle w-full lowercase mb-6 ml-4"></p>
              <span class="flag"
                ><i class="flag-icon fa-regular fa-font-awesome"></i
              ></span>
            </div>
            <div id="answers" class="flex flex-col gap-4 p-2 w-full">
              <!-- <div class="p-1 rounded-lg border-2">
                <input
                  type="radio"
                  name="answer"
                  id=""
                  class="accent-primary hover:accent-primary"
                />
                <label class="answer">answer 1</label>
              </div>
              <div class="p-1 rounded-lg border-2">
                <input type="radio" name="answer" id="" />
                <label class="answer">answer 2</label>
              </div>
              <div class="p-1 rounded-lg border-2">
                <input type="radio" name="answer" id="" />
                <label class="answer">answer 3</label>
              </div>
              <div class="p-1 rounded-lg border-2">
                <input type="radio" name="answer" id="" />
                <label class="answer">answer 4</label>
              </div> -->
            </div>
            <div class="p-5 flex justify-center items-center gap-5">
              <button>
                <i class="p-2 left fa-solid fa-chevron-left text-2xl"></i>
              </button>
              <span class="questionNumber w-[20%] text-center"></span>
              <button>
                <i class="p-2 right fa-solid fa-chevron-right text-2xl"></i>
              </button>
            </div>
            <button
              class="submit w-fit self-end relative overflow-hidden bg-blue-600 text-beige bg-primary px-4 py-2 font-medium rounded-lg group"
            >
              <span
                class="absolute inset-60 bg-white opacity-0 transition-opacity duration-500 group-hover:opacity-75"
              ></span>
              <span
                class="absolute inset-0 bg-gradient-to-r opacity-45 from-transparent via-white to-transparent transform translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500 ease-in-out"
              ></span>
              <span class="relative z-10 capitalize">submit</span>
            </button>
          </div>
          <div id="markedQ" class="p-2 w-full rounded-lg bg-accent md:w-[40%]">
            <p class="text-center mb-2">marked questions</p>
            <hr class="text-primary w-full h-1" />
            <br />
            <div
              class="px-4 flagged flex flex-col justify-between gap-4 h-10 md:h-fit md:max-h-80 overflow-y-auto scrollbar-custom"
            ></div>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="../logic/main.js"></script>
    <script src="../logic/exam.js"></script>
  </body>
</html>
